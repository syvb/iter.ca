baseURL = "https://iter.ca/"
languageCode = "en-CA"
title = "iter.ca"
author = "iter"
enableGitInfo = true

[params]
author = "iter"

[frontmatter]
# https://www.andrewjstevens.com/posts/2021/03/last-modified-date-with-hugo/
lastmod = ["lastmod", ":git", "date", "publishDate"]

[taxonomies]
  tag = "tags"

# /search.json, the index that static/search/search.js searches (themes/smitop/layouts/index.searchindex.json)
[outputFormats.SearchIndex]
mediaType = "application/json"
baseName = "search"
isPlainText = true
notAlternative = true

[outputs]
home = ["HTML", "RSS", "SearchIndex"]


[markup.goldmark.renderer]
unsafe = true # allow raw HTML in posts

[markup]
[markup.tableOfContents]
endLevel = 10
ordered = false
startLevel = 2

[related]
includeNewer = true
toLower = true
[[related.indices]]
name = 'description'
weight = 80
[[related.indices]]
name = 'title'
weight = 60
[[related.indices]]
name = 'tags'
weight = 40
[[related.indices]]
name = 'date'
weight = 5
