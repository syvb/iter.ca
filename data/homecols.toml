# The homepage's lists, in order (themes/smitop/layouts/partials/homecols.html); on a wide screen they are columns, left
# to right. A featured item (verbosity -1 or below) goes in the column with featured = true. No column has that now, so
# no list has the featured items: Highlights, which is written by hand, links to them. An item of verbosity 0 goes in
# one column: the one that lists its Id in ids; failing that, the first one that lists one of its tags or its kind;
# failing that, the one with rest = true. Other items are not listed. An item's kind is "post" or "page" for a page of
# the site, a note's NoteType ("note" if it has none), and the Type of any other data/data.json item.
#
# After its stream items, a column lists its links, which are written here: a title and the url it links to. With before
# or after, a link is a sentence: they are the words around the title, and only the title links. more is where a
# column's heading and its "more..." link go.
#
# A page of content/stream/ with homecol set to a column's title is that column's stream: every item that would go in
# the column by its Id, tags, or kind, featured ones too and as many as there are, up to the page's Verbose (0 if it has
# none; content/stream/ai.md for AI).

# How many stream items a column lists.
limit = 10

# Kinds of which only the newest item is listed, featured items aside.
latest_only = []

[[columns]]
title = "Highlights"
#more = "/stream/me/"

