<ul class="reclist">
    {{ range . }}
        {{ if (eq (len (.Pages)) 0) }}
            <li><div class="list-entry">{{ if .Date }}<time class="list-date">{{ partial "date.html" (dict "t" (int .Date.Unix) "f" "Jan 2 2006") }}</time>{{ end }}<a href="{{.Permalink}}">{{ partial "title.html" .Title }}</a></div></li>
        {{ else }}
            <li>
                <a href="{{.Permalink}}">{{ partial "title.html" .Title }}</a>
                {{ partial "reclist.html" .Pages }}
            </li>
        {{ end }}
    {{ end }}
</ul>
